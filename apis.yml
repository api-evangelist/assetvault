name: AssetVault
description: AssetVault is a London-based consumer fintech platform that helps individuals
  and families catalogue, protect, and grow their valuable assets in one secure digital
  vault. It spans physical items (homes, vehicles, jewelry), digital assets (passwords,
  investment portfolios), and financial holdings, layering on digital estate planning
  (eWill), insurance claims support, analytics, and concierge services. The platform
  emphasizes bank-grade security with encrypted transmission, two-factor authentication,
  and biometric access, and is available as an App Store, Google Play, and web app.
  Added to the API Evangelist network as a Techstars portfolio company; no public API
  surface is published yet.
